<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Norm dip: LERP versus SLERP</title>
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const bg = params.get('parts.page.embed.ctx.bgColor');
  const primary = params.get('parts.page.embed.ctx.primaryColor');
  const mode = params.get('parts.page.embed.ctx.mode');
  // Speculative — Leaflet doesn't send these yet (as of components/Blocks/EmbedBlock.tsx).
  // If they ship them following the existing param pattern, we'll pick them up.
  const bodyFont = params.get('parts.page.embed.ctx.bodyFont');
  const headingFont = params.get('parts.page.embed.ctx.headingFont');
  const root = document.documentElement;

  if (bg && primary) {
    root.style.setProperty('--bg', bg);
    root.style.setProperty('--primary', primary);
    root.style.setProperty('--color-text-primary', primary);
    root.style.setProperty('--color-text-secondary', primary);
    if (mode) root.dataset.embedMode = mode;
  } else {
    root.style.setProperty('--bg', 'transparent');
    root.style.setProperty('--primary', '#888');
    root.style.setProperty('--color-text-primary', '#888');
    root.style.setProperty('--color-text-secondary', '#888');
    root.style.outline = '2px dashed magenta';
    root.style.outlineOffset = '-4px';
    addEventListener('DOMContentLoaded', () => {
      const pill = document.createElement('div');
      pill.textContent = 'preview · no leaflet ctx';
      pill.style.cssText =
        'position:fixed;top:6px;right:6px;background:magenta;color:white;' +
        'font:11px/1 monospace;padding:3px 6px;border-radius:3px;' +
        'z-index:99999;pointer-events:none;';
      document.body.appendChild(pill);
    });
    console.warn('[leaflet-embed] No host context. URL params:',
      Object.fromEntries(params.entries()));
  }

  // Font handling runs independently of color ctx — Leaflet doesn't send these
  // yet, but if it starts (following the Google-Fonts id pattern from src/fonts),
  // we'll pick them up. Otherwise the CSS fallback chain resolves to Quattro.
  if (bodyFont || headingFont) {
    const idToFamily = id => id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const families = [bodyFont, headingFont].filter(Boolean).map(idToFamily);
    if (families.length) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?${families.map(f => `family=${f.replace(/ /g, '+')}`).join('&')}&display=swap`;
      document.head.appendChild(link);
    }
    if (bodyFont) root.style.setProperty('--font-body',
      `"${idToFamily(bodyFont)}", var(--font-quattro)`);
    if (headingFont) root.style.setProperty('--font-heading',
      `"${idToFamily(headingFont)}", var(--font-body, var(--font-quattro))`);
  }
})();
</script>
<style>
  /* Mirror Leaflet's default body font (app/layout.tsx loads these same files
     via next/font/local under --font-quattro). Used as fallback when the host
     doesn't pass a body/heading font down via embed ctx. */
  @font-face {
    font-family: 'iA Writer Quattro V';
    font-style: normal;
    font-display: swap;
    src: url('https://leaflet.pub/fonts/iaw-quattro-vf.woff2') format('woff2-variations');
  }
  @font-face {
    font-family: 'iA Writer Quattro V';
    font-style: italic;
    font-display: swap;
    src: url('https://leaflet.pub/fonts/iaw-quattro-vf-Italic.woff2') format('woff2-variations');
  }

  :root {
    --font-quattro: 'iA Writer Quattro V', ui-sans-serif, system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  body {
    margin: 0;
    font-family: var(--font-body, var(--font-quattro));
  }
  .ctrls { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--primary); }
  .row label { min-width: 56px; }
  .row input[type=range] { flex: 1; }
  .row .val { min-width: 48px; text-align: right; font-family: var(--font-mono); }
  .out { display: flex; gap: 28px; font-size: 13px; padding: 0 16px; margin-top: 14px; font-family: var(--font-mono); color: var(--primary); flex-wrap: wrap; }
  .out span { display: inline-flex; align-items: center; gap: 8px; }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .sw-l { background: #D85A30; }
  .sw-s { background: #1D9E75; }
  .th, .ts { fill: var(--primary); font-family: var(--font-heading, var(--font-body, var(--font-quattro))); }
</style>
</head>
<body>

<svg width="100%" viewBox="0 0 680 360" role="img">
  <title>Norm dip: LERP versus SLERP</title>
  <desc>Two unit vectors X and Y on a circle. The chord between them (LERP) has a midpoint inside the circle with reduced magnitude. The arc between them (SLERP) stays on the circle.</desc>

  <circle cx="340" cy="180" r="150" fill="none" stroke="var(--primary)" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 3"/>

  <circle cx="340" cy="180" r="3" fill="var(--primary)"/>
  <text class="ts" x="332" y="198" text-anchor="end">0</text>

  <line x1="340" y1="180" x2="490" y2="180" stroke="var(--primary)" stroke-width="1.5"/>
  <circle cx="490" cy="180" r="4" fill="var(--primary)"/>
  <text class="th" x="500" y="184" dominant-baseline="central">X</text>

  <line id="y-ln" x1="340" y1="180" x2="340" y2="30" stroke="var(--primary)" stroke-width="1.5"/>
  <circle id="y-dot" cx="340" cy="30" r="4" fill="var(--primary)"/>
  <text id="y-lbl" class="th" x="340" y="22" text-anchor="middle">Y</text>

  <line id="chord" x1="490" y1="180" x2="340" y2="30" stroke="#D85A30" stroke-width="2"/>
  <path id="arc" d="M 490 180 A 150 150 0 0 0 340 30" fill="none" stroke="#1D9E75" stroke-width="2"/>

  <line id="lerp-rad" x1="340" y1="180" x2="415" y2="105" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3"/>
  <line id="slerp-rad" x1="340" y1="180" x2="446" y2="74" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3"/>

  <circle id="lerp-pt" cx="415" cy="105" r="6" fill="#D85A30"/>
  <circle id="slerp-pt" cx="446" cy="74" r="6" fill="#1D9E75"/>
</svg>

<div class="ctrls">
  <div class="row">
    <label>Angle θ</label>
    <input type="range" id="ang" min="20" max="160" value="90" step="1">
    <span class="val" id="ang-v">90°</span>
  </div>
  <div class="row">
    <label>t</label>
    <input type="range" id="tv" min="0" max="1" value="0.5" step="0.01">
    <span class="val" id="tv-v">0.50</span>
  </div>
</div>

<div class="out">
  <span><span class="sw sw-l"></span>‖LERP(t)‖ = <span id="ln">0.707</span></span>
  <span><span class="sw sw-s"></span>‖SLERP(t)‖ = <span id="sn">1.000</span></span>
</div>

<script>
const cx = 340, cy = 180, r = 150;

function upd() {
  const angDeg = +document.getElementById('ang').value;
  const t = +document.getElementById('tv').value;
  const theta = angDeg * Math.PI / 180;

  const yX = cx + r * Math.cos(theta);
  const yY = cy - r * Math.sin(theta);

  const lX = cx + (1 - t) * r + t * r * Math.cos(theta);
  const lY = cy - t * r * Math.sin(theta);
  const lNorm = Math.sqrt((lX - cx) ** 2 + (lY - cy) ** 2) / r;

  const sAng = t * theta;
  const sX = cx + r * Math.cos(sAng);
  const sY = cy - r * Math.sin(sAng);

  document.getElementById('ang-v').textContent = angDeg + '°';
  document.getElementById('tv-v').textContent = t.toFixed(2);
  document.getElementById('ln').textContent = lNorm.toFixed(3);

  document.getElementById('y-ln').setAttribute('x2', yX);
  document.getElementById('y-ln').setAttribute('y2', yY);
  document.getElementById('y-dot').setAttribute('cx', yX);
  document.getElementById('y-dot').setAttribute('cy', yY);

  const lblR = r + 20;
  const lblX = cx + lblR * Math.cos(theta);
  const lblY = cy - lblR * Math.sin(theta);
  document.getElementById('y-lbl').setAttribute('x', lblX);
  document.getElementById('y-lbl').setAttribute('y', lblY + 5);

  document.getElementById('chord').setAttribute('x2', yX);
  document.getElementById('chord').setAttribute('y2', yY);

  document.getElementById('arc').setAttribute('d',
    `M ${cx + r} ${cy} A ${r} ${r} 0 0 0 ${yX.toFixed(2)} ${yY.toFixed(2)}`);

  document.getElementById('lerp-pt').setAttribute('cx', lX);
  document.getElementById('lerp-pt').setAttribute('cy', lY);
  document.getElementById('lerp-rad').setAttribute('x2', lX);
  document.getElementById('lerp-rad').setAttribute('y2', lY);

  document.getElementById('slerp-pt').setAttribute('cx', sX);
  document.getElementById('slerp-pt').setAttribute('cy', sY);
  document.getElementById('slerp-rad').setAttribute('x2', sX);
  document.getElementById('slerp-rad').setAttribute('y2', sY);
}

document.getElementById('ang').addEventListener('input', upd);
document.getElementById('tv').addEventListener('input', upd);
upd();
</script>

</body>
</html>
